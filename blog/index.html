<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawled SEO | The Field Manual</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo-container" style="padding-top: 40px; margin-bottom: 10px;">
      <a href="/">
        <img src="/crawled_logo_main.png" alt="Crawled SEO Logo" class="logo" style="margin: 0 auto; max-width: 200px;">
      </a>
    </div>
    <nav class="navbar">
      <div class="nav-links" style="justify-content: center; display: flex; gap: 2rem;">
        <a href="/" class="nav-link">Home</a>
        <a href="https://crawled.blog/" target="_blank" class="nav-link">Blog</a>
        <a href="/packages" class="nav-link">Packages</a>
        <a href="/#contact" class="nav-link">Contact</a>
      </div>
    </nav>
  </header>

  <main style="padding: 80px 20px; text-align: center;">
    <h1 class="section-title">Latest from the <span style="color: var(--primary);">Field Manual</span></h1>
    <p class="section-text" style="margin-bottom: 40px;">Insights on SEO, GEO, and the future of search visibility.</p>
    
    <div id="blog-posts" class="feed-grid">
      <p>Loading the latest insights...</p>
    </div>
  </main>

  <script>
    // Using a CORS proxy to bypass Hashnode's security block
    const RSS_URL = encodeURIComponent(`https://crawled.blog/rss.xml`);
    const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${RSS_URL}`;

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('blog-posts');
        if (data.status === 'ok') {
          container.innerHTML = ''; // Clear loading message
          data.items.slice(0, 6).forEach(item => {
            const cleanSnippet = item.description.replace(/<[^>]*>/g, '').substring(0, 150);
            container.innerHTML += `
              <a href="${item.link}" target="_blank" class="feed-card">
                <div class="feed-content" style="text-align: left;">
                  <span class="feed-date">${new Date(item.pubDate).toLocaleDateString()}</span>
                  <h3>${item.title}</h3>
                  <p>${cleanSnippet}...</p>
                  <span class="read-more" style="color: var(--primary); font-weight: 600;">Read Full Entry →</span>
                </div>
              </a>
            `;
          });
        } else {
          throw new Error('Feed status not OK');
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('blog-posts').innerHTML = "<p>Please visit <a href='https://crawled.blog' style='color: var(--primary);'>crawled.blog</a> directly for the latest updates.</p>";
      });
  </script>

  <footer class="footer" style="margin-top: 60px;">
    <p class="footer-text">© 2026 Crawled SEO. All rights reserved.</p>
  </footer>
</body>
</html>
