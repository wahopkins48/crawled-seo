<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawled SEO | The Field Manual</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo-container" style="padding-top: 40px; margin-bottom: 10px;">
      <a href="/">
        <img src="/crawled_logo_main.png" alt="Crawled SEO Logo" class="logo" style="margin: 0 auto; max-width: 200px;">
      </a>
    </div>
    <nav class="navbar">
      <div class="nav-links" style="justify-content: center; display: flex; gap: 2rem;">
        <a href="/" class="nav-link">Home</a>
        <a href="https://crawled.blog/" target="_blank" rel="noopener noreferrer" class="nav-link">Blog</a>
        <a href="/packages" class="nav-link">Packages</a>
        <a href="/#contact" class="nav-link">Contact</a>
      </div>
    </nav>
  </header>

  <main style="padding: 80px 20px;">
    <div id="rss-feed-container">
      <h2 class="section-title">Latest from the <span style="color: var(--primary);">Field Manual</span></h2>
      <p class="section-text" style="margin-bottom: 40px;">Insights on SEO, GEO, and the future of search visibility.</p>
      
      <div id="blog-posts" class="feed-grid">
        </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="footer-text">© 2026 Crawled SEO. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const RSS_URL = `https://crawled.blog/rss.xml`;
    // Using rss2json API to parse the XML feed you provided
    fetch(`https://api.rss2json.com/v1/api.json?rss_url=${RSS_URL}`)
      .then(response => response.json())
      .then(data => {
        const container = document.getElementById('blog-posts');
        data.items.slice(0, 6).forEach(item => {
          const card = `
            <a href="${item.link}" target="_blank" class="feed-card">
              <div class="feed-content">
                <span class="feed-date">${new Date(item.pubDate).toLocaleDateString()}</span>
                <h3>${item.title}</h3>
                <p>${item.description.replace(/<[^>]*>/g, '').substring(0, 150)}...</p>
                <span class="read-more">Read Full Entry →</span>
              </div>
            </a>
          `;
          container.innerHTML += card;
        });
      })
      .catch(err => {
        console.error("Error fetching feed:", err);
        document.getElementById('blog-posts').innerHTML = "<p>Unable to load blog posts at this time.</p>";
      });
  </script>

</body>
</html>
