<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crawled SEO Blog | Latest SEO, AI Visibility Insights</title>
  <meta name="description" content="Expert insights on SEO, Google updates, AI search visibility from Crawled SEO. Covering troll farms, core updates, and more.">
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- RSS for dynamic feed -->
  <link rel="alternate" type="application/rss+xml" title="Crawled SEO Blog" href="/blog/rss.xml">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": "Crawled SEO Blog",
    "url": "https://crawledseo.com/blog",
    "description": "Insights on SEO, GEO, AI visibility, and search future."
  }
  </script>
</head>
<body>

  <header class="header">
    <div class="logo-container" style="padding-top: 40px; margin-bottom: 10px;">
      <a href="/">
        <img src="/crawled_logo_main.png" alt="Crawled SEO Logo" class="logo" style="margin: 0 auto; max-width: 200px;">
      </a>
    </div>
    <nav class="navbar">
      <div class="nav-links" style="justify-content: center; display: flex; gap: 2rem;">
        <a href="/" class="nav-link">Home</a>
        <a href="/blog" class="nav-link active">Blog</a>  <!-- Now internal -->
        <a href="/packages" class="nav-link">Packages</a>
        <a href="/#contact" class="nav-link">Contact</a>
      </div>
    </nav>
  </header>

  <main style="padding: 80px 20px; text-align: center;">
    <h1 class="section-title">Latest from the <span style="color: var(--primary);">Blog</span></h1>
    <p class="section-text" style="margin-bottom: 40px;">Insights on SEO, GEO, and the future of search visibility. Updated automatically from our feed.</p>
    
    <div class="feed-grid" id="feed-grid">
      <!-- Posts populated by JS below; fallback static for now -->
      <article itemscope itemtype="https://schema.org/BlogPosting" style="display:none;">
        <!-- Schema template -->
      </article>
    </div>

    <div style="margin-top: 50px;">
       <a href="/blog/archive" class="btn btn-primary">View All Posts</a>  <!-- Future archive page -->
    </div>
  </main>

  <footer class="footer" style="margin-top: 60px;">
    <p class="footer-text">© 2026 Crawled SEO. All rights reserved. | <a href="/sitemap.xml">Sitemap</a></p>
  </footer>

  <script>
    // Fetch Hashnode RSS and populate cards (proxy if CORS issue)
    fetch('https://crawled.blog/rss')
      .then(r => r.text())
      .then(data => {
        const parser = new DOMParser();
        const xml = parser.parseFromString(data, 'text/xml');
        const items = xml.querySelectorAll('item');
        const grid = document.getElementById('feed-grid');
        items.slice(0,6).forEach((item, i) => {
          const title = item.querySelector('title').textContent;
          const link = item.querySelector('link').textContent;
          const slug = link.split('/').pop();
          const pubDate = new Date(item.querySelector('pubDate').textContent).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
          const desc = item.querySelector('description').textContent.substring(0,150) + '...';
          const card = document.createElement('a');
          card.href = `/blog/${slug}`;  // Internal slug page
          card.className = 'feed-card';
          card.innerHTML = `
            <div class="feed-content" style="text-align: left;" itemprop="blogPost" itemscope itemtype="https://schema.org/BlogPosting">
              <span class="feed-date" itemprop="datePublished">${pubDate}</span>
              <h3 itemprop="headline">${title}</h3>
              <p itemprop="description">${desc}</p>
              <span class="read-more" style="color: var(--primary); font-weight: 600;">Read Full Post →</span>
              <link itemprop="url" href="https://crawledseo.com/blog/${slug}">
              <link rel="canonical" href="https://crawledseo.com/blog/${slug}">
            </div>
          `;
          grid.appendChild(card);
        });
      })
      .catch(() => {
        // Fallback to static posts if RSS fails
        grid.innerHTML = staticPostsHTML;  // Define static HTML var from your current code
      });
  </script>
</body>
</html>
